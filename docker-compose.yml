name: saas-leadflow

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  image: saas-leadflow-app:latest
  env_file:
    - ${DOCKER_ENV_FILE:-.env}
  restart: unless-stopped
  networks:
    - leadflow
  volumes:
    - app_storage:/var/www/html/storage

x-app-runtime: &app-runtime
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    networks:
      - leadflow
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *app-image
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-runtime
      CONTAINER_ROLE: migrate
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "false"
    command: ["sh", "-c", "echo 'Database migrations completed.'"]
    restart: "no"

  app:
    <<: *app-image
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-runtime
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "false"
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: saas-leadflow-nginx:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - leadflow
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  queue:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    environment:
      <<: *app-runtime
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--timeout=300"]
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -v grep | grep -q 'artisan queue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    environment:
      <<: *app-runtime
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -v grep | grep -q 'artisan schedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  leadflow:
    driver: bridge

volumes:
  redis_data:
  app_storage:
